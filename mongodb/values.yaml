name: 'mongodb'
replicaCount: 3
version: '8.2.0'

# Extra labels/annotations for the MongoDBCommunity resource
labels: {}
annotations: {}

auth:
  password: ''
  username: 'root'
  scramCredentialsSecretName: 'my-scram'

persistent:
  storageClass: ''
  size: '3Gi'
  accessModes:
    - ReadWriteOnce

log:
  persistent:
    storageClass: ''
    size: '1Gi'
    accessModes:
      - ReadWriteOnce

# Extra mongod configuration, merged into spec.additionalMongodConfig
additionalMongodConfig:
  storage.wiredTiger.engineConfig.journalCompressor: zlib

mongod:
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
  securityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: false

mongodbAgent:
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 50m
    #   memory: 128Mi
  securityContext: {}

# MongoDB Search (mongot), deployed as a MongoDBSearch resource next to the replica set.
# Requires MongoDB >= 8.2.0 and MCK >= 1.10 (or mongot.legacySpec on older MCK).
mongot:
  enabled: false
  # Render the pre-1.10 MongoDBSearch schema (top-level persistence/resourceRequirements/statefulSet
  # instead of spec.clusters). Required on MCK < 1.10, where jvmFlags, advancedConfigs, nodeAffinity,
  # loadBalancer and observability are not supported and replicas must be 1.
  legacySpec: false
  # mongot version, empty lets the operator pick
  version: ''
  # TRACE | DEBUG | INFO | WARN | ERROR (operator default: INFO)
  logLevel: ''
  # More than 1 replica requires loadBalancer to be set
  replicas: 1
  resources: {}
    # limits:
    #   cpu: '2'
    #   memory: 4Gi
    # requests:
    #   cpu: '1'
    #   memory: 2Gi
  persistent:
    storageClass: ''
    size: '10Gi'
  # Passed to mongot as --jvm-flags, e.g. ['-Xms2g', '-Xmx2g']
  jvmFlags: []
  # Rendered verbatim under advancedConfigs of the mongot config file
  advancedConfigs: {}
    # indexing:
    #   lucene:
    #     fieldLimit: 1500
  nodeAffinity: {}
  # managed (Envoy) or unmanaged load balancer, see spec.clusters[].loadBalancer
  loadBalancer: {}
    # managed:
    #   replicas: 1
  # Service account of the mongot pods, defaults to <name>-sa (the operator's default,
  # mongodb-kubernetes-database-pods, only exists in explicitly watched namespaces)
  serviceAccountName: ''
  # Overrides merged into the mongot StatefulSet
  statefulSet: {}
  # User mongot authenticates as to sync data from the replica set, must differ from auth.username
  syncSource:
    username: 'search-sync-source'
    # Stored in <name>-search-sync-source-password, required unless existingSecret is set
    password: ''
    # Existing secret with a `password` key
    existingSecret: ''
  tls:
    # Secret with tls.crt/tls.key for the mongot server, empty disables TLS
    certificateKeySecretName: ''
  # spec.observability, e.g. prometheus.mode: disabled
  observability: {}

# Override the headless service name (defaults to the resource name via the operator)
serviceName: ''

# PodDisruptionBudget for the replica set pods.
# minAvailable takes precedence over maxUnavailable (only one may be set).
# selectorLabels overrides the default selector, which matches the pod label the
# community operator applies: app: <serviceName|name-svc>
pdb:
  enabled: false
  minAvailable: 2
  maxUnavailable:
  unhealthyPodEvictionPolicy: ''
  selectorLabels: {}

podAnnotations: {}
podLabels: {}

imagePullSecrets: []
  # - name: my-registry-secret

podSecurityContext: {}
  # fsGroup: 2000
  # runAsNonRoot: true
  # runAsUser: 2000

priorityClassName: ''
terminationGracePeriodSeconds: ''

nodeSelector: {}
  # kubernetes.io/os: linux

tolerations: []
  # - key: 'database'
  #   operator: 'Equal'
  #   value: 'true'
  #   effect: 'NoSchedule'

affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchExpressions:
  #           - key: app
  #             operator: In
  #             values:
  #               - mongodb-svc
  #       topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app: mongodb-svc
