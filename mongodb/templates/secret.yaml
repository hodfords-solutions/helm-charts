---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-mongodb-secret
type: Opaque
stringData:
  password: {{ .Values.auth.password | quote }}
{{- if and .Values.mongot.enabled (not .Values.mongot.syncSource.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongot.syncSourceSecretName" . }}
type: Opaque
stringData:
  password: {{ required "mongot.syncSource.password is required when mongot.enabled and no existingSecret is set" .Values.mongot.syncSource.password | quote }}
{{- end }}
