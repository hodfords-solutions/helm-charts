{{- if and .Values.secretFiles.enabled .Values.secretFiles.files }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-files
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $content := .Values.secretFiles.files }}
  {{ $name }}: |-
    {{- tpl $content $ | nindent 4 }}
  {{- end }}
{{- end }}
