{{- if .Values.httproute.enabled -}}
{{- $values := .Values.httproute -}}
{{- $fullName := include "backend.fullname" . -}}
{{- $backend := include "backend.httprouteBackend" . | fromYaml -}}
{{- $hosts := (include "backend.gatewayHostnames" . | fromYaml).items -}}
{{- if and (not $values.parentRefs) (not .Values.listenerset.enabled) -}}
{{- fail "httproute.enabled requires httproute.parentRefs or listenerset.enabled" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    {{- with $values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if $values.parentRefs }}
    {{- toYaml $values.parentRefs | nindent 4 }}
    {{- else }}
    {{- /* No sectionName: attach to every listener of the ListenerSet (one per hostname) */}}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $fullName }}
    {{- end }}
  {{- with $hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $values.rules }}
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ $backend.name }}
          port: {{ $backend.port }}
          weight: 1
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- if $values.httpsRedirect.enabled }}
{{- if not $values.httpsRedirect.parentRefs }}
{{- fail "httproute.httpsRedirect.enabled requires httproute.httpsRedirect.parentRefs (the Gateway's plain HTTP listener)" -}}
{{- end }}
---
# HTTP -> HTTPS redirect on the Gateway's shared HTTP listener. cert-manager's HTTP-01
# solver routes (Exact /.well-known/acme-challenge/<token>) for the same host win over it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-http-redirect" $fullName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    {{- with $values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- toYaml $values.httpsRedirect.parentRefs | nindent 4 }}
  {{- with $hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ $values.httpsRedirect.statusCode }}
{{- end }}
{{- end }}
