{{- if .Values.listenerset.enabled -}}
{{- $values := .Values.listenerset -}}
{{- if not $values.parentRef.name -}}
{{- fail "listenerset.enabled requires listenerset.parentRef.name (the shared Gateway)" -}}
{{- end -}}
{{- $hosts := (include "backend.gatewayHostnames" . | fromYaml).items -}}
{{- if and (not $values.listeners) (not $hosts) -}}
{{- fail "listenerset.enabled requires listenerset.listeners, httproute.hostnames or ingress.host/hosts" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    {{- with $values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    {{- toYaml $values.parentRef | nindent 4 }}
  listeners:
    {{- if $values.listeners }}
    {{- tpl (toYaml $values.listeners) . | nindent 4 }}
    {{- else }}
    {{- range $i, $host := $hosts }}
    - name: {{ $i | eq 0 | ternary $values.listenerName (printf "%s-%d" $values.listenerName $i) }}
      hostname: {{ $host | quote }}
      port: {{ $values.port }}
      protocol: {{ $values.protocol }}
      {{- if $values.tls.enabled }}
      tls:
        mode: {{ $values.tls.mode }}
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "backend.listenerSecretName" $ }}
      {{- end }}
      allowedRoutes:
        {{- toYaml $values.allowedRoutes | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
