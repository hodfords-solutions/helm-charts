replicaCount: 1

image:
  repository: rspamd/rspamd
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101

securityContext: {}
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL

service:
  type: ClusterIP
  # Milter/proxy worker
  proxyPort: 11332
  # Normal (scan) worker
  port: 11333
  # Controller (web UI, API)
  controllerPort: 11334
  annotations: {}

# Probes hit the controller worker, so config.workerController.enabled must stay
# true and the controller must listen on the pod IP (see bindSocket).
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 60

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 30

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage:
  metrics: []
  behavior: {}

# PodDisruptionBudget, only useful with more than one replica.
# minAvailable takes precedence over maxUnavailable.
pdb:
  enabled: false
  minAvailable:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: ''

priorityClassName: ''
terminationGracePeriodSeconds: ''

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

config:
  # Additional Rspamd options rendered to /etc/rspamd/local.d/options.inc.
  options: ''
  # ARC module configuration rendered to /etc/rspamd/local.d/arc.conf.
  arc: ''
  # RBL overrides rendered to /etc/rspamd/local.d/rbl.conf.
  rbl: ''
  # Scoped policy overrides rendered to /etc/rspamd/local.d/settings.conf.
  settings: ''
  historyRedis:
    # Render /etc/rspamd/local.d/history_redis.conf when Redis is enabled.
    enabled: true
    # Redis history key prefix. The default matches Rspamd upstream and expands inside Rspamd.
    keyPrefix: 'rs_history{{HOSTNAME}}{{COMPRESS}}'
    # Maximum number of Redis history rows.
    nrows: 200
    # Enable Redis history compression.
    compress: true
    # Enable Redis history subject privacy.
    subjectPrivacy: false
    # Additional raw history_redis configuration.
    extraConfig: ''
  workerController:
    # Render /etc/rspamd/local.d/worker-controller.inc.
    enabled: true
    # Controller bind socket. Must be reachable by kubelet when probes are enabled.
    bindSocket: '*:11334'
    # IPs or CIDR ranges allowed to access the controller without a password.
    secureIp:
      - '127.0.0.1'
      - '::1'
    # Optional controller password. Rendered into a Secret, not a ConfigMap.
    password: ''
    # Optional controller enable_password. Rendered into a Secret, not a ConfigMap.
    enablePassword: ''
    # Additional raw controller worker configuration.
    extraConfig: ''
  workerNormal:
    bindSocket: '*:11333'
    extraConfig: ''
  workerProxy:
    bindSocket: '*:11332'
    extraConfig: ''
  blacklist:
    fromMap: ''
    ipMap: ''
  whitelist:
    fromMap: ''
    ipMap: ''
  milterHeaders: |
    use = ["x-spamd-bar", "x-spam-level", "authentication-results"];
    authenticated_headers = ["authentication-results"];
  dkimSelector: 2020
  multiMap: |
    WHITELIST_IP {
      type = "ip";
      map = "$CONFDIR/local.d/whitelist_ip.map";
      description = "Local ip whitelist";
      action = "accept";
    }

    WHITELIST_FROM {
      type = "from";
      map = "$CONFDIR/local.d/whitelist_from.map";
      description = "Local from whitelist";
      action = "accept";
    }
  overrideClassifierBayes: |
    autolearn = true;

# External Redis or Valkey backend. There is no embedded Redis in this chart.
redis:
  enabled: false
  host: ''
  port: 6379
  # Optional Redis database number rendered as Rspamd `db`.
  db: ''
  # Optional Redis ACL username.
  username: ''
  # Optional Redis password. Rendered into a Secret, not a ConfigMap.
  # Prefer existingSecret for production.
  password: ''
  # Existing Secret containing the Redis password. An init container reads it through
  # REDIS_PASSWORD and writes the final Redis config to an emptyDir before Rspamd starts.
  existingSecret: ''
  # Key in redis.existingSecret containing the Redis password.
  existingSecretPasswordKey: password
  # Optional Rspamd Redis timeout value.
  timeout: ''

persistence:
  enabled: false
  existingClaim: ''
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ''
  annotations: {}
