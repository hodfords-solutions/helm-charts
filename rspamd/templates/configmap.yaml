{{- include "rspamd.validateRedis" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rspamd.fullname" . }}
  labels:
    {{- include "rspamd.labels" . | nindent 4 }}
data:
{{- if .Values.redis.enabled }}
  classifier-bayes.conf: |
    backend = "redis";
{{- else }}
  classifier-bayes.conf: ''
{{- end }}
  worker-normal.inc: |
    bind_socket = {{ .Values.config.workerNormal.bindSocket | quote }};
    {{- with .Values.config.workerNormal.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
  worker-proxy.inc: |
    bind_socket = {{ .Values.config.workerProxy.bindSocket | quote }};
    upstream "local" {
      default = yes;
      self_scan = yes;
    }
    {{- with .Values.config.workerProxy.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
{{- if and .Values.config.workerController.enabled (not (include "rspamd.controllerSecretEnabled" .)) }}
  worker-controller.inc: |
    {{- include "rspamd.workerControllerConfig" . | nindent 4 }}
{{- end }}
{{- with .Values.config.options }}
  options.inc: |{{ . | nindent 4 }}
{{- end }}
{{- with .Values.config.rbl }}
  rbl.conf: |{{ . | nindent 4 }}
{{- end }}
{{- with .Values.config.settings }}
  settings.conf: |{{ . | nindent 4 }}
{{- end }}
{{- with .Values.config.arc }}
  arc.conf: |{{ . | nindent 4 }}
{{- end }}
  dkim_signing.conf: |
    path = "/var/lib/rspamd/dkim/$selector.key";
    selector = {{ .Values.config.dkimSelector | quote }};
    # Enable DKIM signing for alias sender addresses
    allow_username_mismatch = true;
  milter_headers.conf: |
{{ .Values.config.milterHeaders | indent 4 }}
  override-classifier-bayes.conf: |
{{ .Values.config.overrideClassifierBayes | indent 4 }}
  multimap.conf: |
{{ .Values.config.multiMap | indent 4 }}
  whitelist_ip.map: |
{{ .Values.config.whitelist.ipMap | indent 4 }}
  whitelist_from.map: |
{{ .Values.config.whitelist.fromMap | indent 4 }}
  blacklist_ip.map: |
{{ .Values.config.blacklist.ipMap | indent 4 }}
  blacklist_from.map: |
{{ .Values.config.blacklist.fromMap | indent 4 }}
