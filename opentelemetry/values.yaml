name: 'my-collector'

# Optional secret holding credentials referenced by the collector env (e.g. langfuse basic auth)
secret:
  enabled: false
  # Defaults to <name>-secret
  name: ''
  data: {}
    # AUTH_STRING: 'cGstbGYtLi4uOnNrLWxmLS4uLg=='

collector:
  enabled: true
  # Namespace of the OpenTelemetryCollector resource (defaults to the release namespace)
  namespace: ''

  # deployment | daemonset | statefulset | sidecar
  mode: 'deployment'
  replicas: 1

  # Override the collector image, e.g. otel/opentelemetry-collector-contrib:0.140.0
  image: ''
  imagePullPolicy: ''
  serviceAccount: ''

  labels: {}
  annotations: {}
  podAnnotations: {}

  env: []
    # - name: LANGFUSE_AUTH_STRING
    #   valueFrom:
    #     secretKeyRef:
    #       name: langfuse-otel-auth
    #       key: AUTH_STRING

  envFrom: []
    # - secretRef:
    #     name: langfuse-otel-auth

  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi

  args: {}
  ports: []
  volumes: []
  volumeMounts: []
  volumeClaimTemplates: []

  podSecurityContext: {}
  securityContext: {}

  priorityClassName: ''
  terminationGracePeriodSeconds: ''

  nodeSelector: {}
    # kubernetes.io/os: linux

  tolerations: []
    # - key: 'observability'
    #   operator: 'Equal'
    #   value: 'true'
    #   effect: 'NoSchedule'

  affinity: {}
  topologySpreadConstraints: []

  autoscaler: {}
    # minReplicas: 1
    # maxReplicas: 5
    # targetCPUUtilization: 80

  # Passed as-is to the operator (spec.ingress), which only knows Ingress/OpenShift Route.
  # Use certificate/listenerset/httproute below for the Istio gateway (Gateway API).
  ingress: {}

  # Gateway API (Istio ingress gateway), same layout as the argo-cd chart's
  # server.certificate / server.listenerset / server.httproute. Hostnames default to
  # ingress.hostname. The shared Gateway must allow this namespace in
  # spec.allowedListeners and, for the redirect / HTTP-01 routes, in its HTTP listener.
  certificate:
    enabled: false
    # commonName, defaults to the first hostname
    domain: ''
    additionalHosts: []
    # Defaults to <name>-tls
    secretName: ''
    duration: ''
    renewBefore: ''
    issuer:
      group: ''
      kind: ClusterIssuer
      name: ''
    privateKey: {}
    annotations: {}

  listenerset:
    enabled: false
    labels: {}
    annotations: {}
    # The shared Gateway, exactly one
    parentRef: {}
      # name: tool-gateway
      # namespace: istio-ingress
    # One listener per hostname, suffixed with the index from the second one on
    listenerName: https
    port: 443
    protocol: HTTPS
    tls:
      enabled: true
      mode: Terminate
      # Defaults to the Certificate secret
      secretName: ''
    allowedRoutes:
      namespaces:
        from: Same
    # Used verbatim (templated) instead of the synthesized listeners
    listeners: []

  # OTLP/HTTP only, OTLP/gRPC would need a GRPCRoute
  httproute:
    enabled: false
    labels: {}
    annotations: {}
    # Defaults to this release's ListenerSet
    parentRefs: []
    hostnames: []
    # Port of the <name>-collector Service (4318 = otlp-http)
    servicePort: 4318
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
    httpsRedirect:
      enabled: false
      statusCode: 301
      # The Gateway's plain HTTP listener
      parentRefs: []
        # - name: tool-gateway
        #   namespace: istio-ingress
        #   sectionName: http

  targetAllocator: {}
  observability: {}

  # Rendered as-is into spec.config
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]

# One entry per Instrumentation resource
instrumentations:
  - enabled: true
    # Defaults to <name>-instrumentation (suffixed with the index from the second entry on)
    name: ''
    # Namespace of the Instrumentation resource - it must live in the namespace of
    # the instrumented workloads (defaults to the release namespace)
    namespace: ''
    # Create the same Instrumentation in several namespaces (takes precedence over `namespace`)
    namespaces: []
      # - employer-dev
      # - backend-dev

    labels: {}
    annotations: {}

    exporter:
      endpoint: 'http://my-collector-collector.opentelemetry.svc:4318'
      tls: {}

    propagators:
      - tracecontext
      - baggage
      - b3

    sampler:
      type: always_on
      # argument: '0.25'

    resource: {}
      # addK8sUIDAttributes: true
      # resourceAttributes:
      #   environment: dev

    env: []
      # - name: OTEL_EXPORTER_OTLP_TIMEOUT
      #   value: '20'

    # Per-language auto-instrumentation overrides
    java: {}
    nodejs: {}
      # image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
      # env:
      #   - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
      #     value: http,express
    python: {}
    dotnet: {}
    go: {}
    apacheHttpd: {}
    nginx: {}
